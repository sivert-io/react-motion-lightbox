# Builds the demo and runs its checks. The site itself runs on edition35
# (demo/docker-compose.yml), not GitHub Pages.
name: Demo

on:
  push:
    branches: [main]
    paths: ['demo/**', 'src/**', '.github/workflows/demo.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: demo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The demo imports the package's source, which needs the package's own deps.
      - run: npm ci
        working-directory: .
      - run: npm ci
      - run: npm test
      - run: npm run build
