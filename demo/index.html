<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- The package name first: it's what people search for. -->
    <title>react-motion-lightbox: a lightbox for React</title>
    <meta
      name="description"
      content="A React lightbox and gallery that opens out of the photo you click and closes back into it. Drag, swipe, zoom, crop to a focus point. Try it, then copy the code."
    />
    <link rel="canonical" href="https://lightbox.gullberg.no/" />
    <meta name="theme-color" content="#fff4f1" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1d100f" media="(prefers-color-scheme: dark)" />

    <link rel="icon" href="/logo.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- The two faces in the first screen. Same-origin, so no second connection. -->
    <link rel="preload" href="/fonts/young-serif.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/figtree.woff2" as="font" type="font/woff2" crossorigin />
    <!-- On a laptop the first album's photo is the biggest thing on screen, and the
         gallery only asks for it once the script has run. Same candidates and
         about the same size as Gallery works out, so the browser picks the same
         file and uses this one. Below 1024px it's further down, so not then. -->
    <link
      rel="preload"
      as="image"
      media="(min-width: 1024px)"
      imagesrcset="/photos/p2D3wsu5pQM-1280.webp 1280w, /photos/p2D3wsu5pQM-2560.webp 2560w, /photos/p2D3wsu5pQM-3840.webp 3840w"
      imagesizes="1230px"
      fetchpriority="high"
    />

    <!-- Link previews. Scrapers don't resolve relative URLs, so these are absolute. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="react-motion-lightbox" />
    <meta property="og:url" content="https://lightbox.gullberg.no/" />
    <meta property="og:title" content="react-motion-lightbox" />
    <meta
      property="og:description"
      content="A React lightbox that opens out of the photo you click and closes back into it. Try it, then copy the code."
    />
    <meta property="og:image" content="https://lightbox.gullberg.no/og.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="The react-motion-lightbox mushroom logo and the words A lightbox that opens out of the photo you click, beside a photo with a square drawn over the person on the cliff."
    />
    <meta name="twitter:card" content="summary_large_image" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareSourceCode",
        "name": "react-motion-lightbox",
        "description": "A React lightbox and gallery that opens out of the photo you click and closes back into it.",
        "url": "https://lightbox.gullberg.no/",
        "codeRepository": "https://github.com/sivert-io/react-motion-lightbox",
        "programmingLanguage": ["TypeScript", "React"],
        "license": "https://opensource.org/licenses/MIT",
        "author": { "@type": "Person", "name": "Sivert Gullberg Hansen", "url": "https://gullberg.no" }
      }
    </script>

    <script>
      try { const t = localStorage.getItem('theme'); if (t) document.documentElement.dataset.theme = t } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      react-motion-lightbox is a React lightbox that opens out of the photo you click. The examples on this page need
      JavaScript. The code and docs are on GitHub: https://github.com/sivert-io/react-motion-lightbox
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
