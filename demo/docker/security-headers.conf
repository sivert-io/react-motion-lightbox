# Included into the server block and re-included into every location that sets
# an `add_header` of its own — nginx replaces the inherited set rather than
# extending it, so a location that adds Cache-Control would otherwise silently
# drop all three of these.
#
# Not a security boundary, just the headers that cost nothing on a static site.
# No CSP: the page loads Google Fonts, so a policy has to be written around
# that, which is worth doing deliberately rather than in passing.
add_header X-Content-Type-Options 'nosniff' always;
add_header Referrer-Policy 'strict-origin-when-cross-origin' always;
add_header X-Frame-Options 'SAMEORIGIN' always;
